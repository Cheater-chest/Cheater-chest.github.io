# ============================================================
# Jekyll 站点主配置（GitHub Pages 用）
# 部署前必改：把下面所有 username 替换成你的 GitHub 用户名
# ============================================================

# —— 站点信息 ——
title: "ZSYZ_CPY 的博客"
author: Cheater-chest
email: "junyihao957o6@qq.com"
description: >-
  I will upload sone articles from Luogu and others.

# —— 部署地址 ——
# 用户页（仓库名 username.github.io）：https://username.github.io
# 项目页（普通仓库）：https://username.github.io/仓库名
url: "https://Cheater-chest.github.io"
baseurl: ""                # 项目页部署时改为 "/仓库名"，例如 "/blogs"
repository: "Cheater-chest/blogs"

# —— 语言与时区 ——
lang: zh-CN
timezone: Asia/Guangdong

# —— 写作与构建 ——
markdown: kramdown
highlighter: rouge
permalink: /:title/
excerpt_separator: "\n\n"

# —— 插件（均在 GitHub Pages 白名单内）——
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# —— 分页 ——
paginate: 5
paginate_path: "/page:num/"

# —— 不参与构建的文件/目录 ——
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
